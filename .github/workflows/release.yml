# MRstreamdeck-Release: beim Pushen eines Tags "STA-<version>-bu<build>" (stabil) bzw. "BET-..." (Beta), z.B.
# BET-0.1.0-bu001, ein GitHub-Release mit der .streamDeckPlugin-Datei. Stable nur von main, Beta nur von beta.
# Das Plugin hängt an keiner Minecraft-Version (es spricht nur mit MRadmin) - darum ohne "mc<version>-" davor.
# Vorher läuft die ganze Prüfrunde (checks.yml); veröffentlicht wird genau die dort gepackte Datei, mit
# Herkunftsnachweis ("gh attestation verify <datei> -R therealmarci/mrstreamdeck"). Ablauf: docs/RELEASES.md
name: Release

on:
  push:
    tags: ['STA-*', 'BET-*']
  # By hand on a tag ("Run workflow", choose the tag) - in case a push does not start workflows.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    permissions:
      contents: read
      security-events: write

  release:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write       # Release anlegen
      id-token: write       # Herkunftsnachweis
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # nötig, um zu prüfen, auf welchem Branch der Tag liegt
          persist-credentials: false

      - name: Tag mit version.properties abgleichen
        run: |
          VERSION=$(grep '^version=' version.properties | cut -d= -f2 | tr -d '[:space:]')
          if ! printf '%s' "$VERSION" | grep -Eq '^(STA|BET)-[0-9]+\.[0-9]+\.[0-9]+-bu[0-9]{3,}$'; then
            echo "::error::version=$VERSION in version.properties hat nicht das Format STA-1.4.0-bu001 bzw. BET-1.4.0-bu001"
            exit 1
          fi
          if [ "$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME passt nicht zu version.properties (erwartet: $VERSION)"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          case "$VERSION" in
            BET-*) echo "PRERELEASE=true" >> "$GITHUB_ENV" ;;
            *)     echo "PRERELEASE=false" >> "$GITHUB_ENV" ;;
          esac

      # Stable (STA) nur von main, Beta (BET) nur von beta. Als "Latest" gilt nur eine Stable.
      - name: Branch prüfen
        run: |
          on() { git merge-base --is-ancestor "$GITHUB_SHA" "origin/$1" 2>/dev/null; }
          LATEST=false
          if [ "$PRERELEASE" = "false" ]; then
            on main || { echo "::error::Stable $VERSION muss auf main getaggt werden."; exit 1; }
            LATEST=true
          else
            on beta || { echo "::error::Beta $VERSION muss auf beta getaggt werden."; exit 1; }
          fi
          echo "LATEST=$LATEST" >> "$GITHUB_ENV"

      - name: Geprüfte Datei aus der Prüfrunde holen
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: MRstreamdeck
          path: ./release-file

      - name: Datei prüfen
        run: |
          FILE="release-file/MRstreamdeck-$VERSION.streamDeckPlugin"
          if [ ! -f "$FILE" ]; then
            echo "::error::$FILE fehlt im Ergebnis der Prüfrunde (vorhanden: $(ls release-file | tr '\n' ' '))"
            exit 1
          fi
          echo "FILE=./$FILE" >> "$GITHUB_ENV"
          sha256sum "$FILE"

      - name: Changelog-Abschnitt auslesen
        run: |
          awk -v v="$VERSION" '/^## \[/ { p = index($0, "[" v "]") > 0; next } p' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::Kein Abschnitt '## [$VERSION]' in CHANGELOG.md gefunden"
            exit 1
          fi

      - name: Herkunftsnachweis
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.FILE }}

      - name: GitHub-Release erstellen
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: MRstreamdeck ${{ env.VERSION }}
          body_path: ./release-notes.md
          files: |
            ${{ env.FILE }}
          prerelease: ${{ env.PRERELEASE == 'true' }}
          make_latest: ${{ env.LATEST }}
