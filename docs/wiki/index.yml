      - {id: verbinden, file: verbinden.md, title: {de: Verbinden, en: Connecting}}
  - title: {de: Für Spieler, en: For players}
    audience: player
    pages:
      - {id: tasten, file: tasten.md, title: {de: Tasten für Spieler, en: Keys for players}}
  - title: {de: Für Admins, en: For admins}
    audience: admin
    pages:
      - {id: team-tasten, file: team-tasten.md, title: {de: Tasten fürs Team, en: Keys for the team}}
      - {id: faq, file: faq.md, title: {de: Häufige Fragen, en: FAQ}}
  - title: {de: Mehr, en: More}
    pages:
      - {id: changelog, file: /CHANGELOG.md, title: {de: Changelog, en: Changelog}}
